<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoNabor — Useful Things. Near You.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   GONABOR DESIGN SYSTEM
   Palette derived from the GoNabor logo:
   - Navy (wordmark, roofline pillar, structure/nav)
   - Orange -> Gold (the smiling pin, primary energy, Home Harvest)
   - Green (roof windows, growth, Give/free, success)
   ================================================================ */
:root{
  --navy-900:#0F2242;
  --navy-800:#152F55;
  --navy-700:#1B3A6B;
  --navy-600:#274a80;
  --navy-100:#E7ECF5;

  --orange-600:#E85F0F;
  --orange-500:#F97316;
  --gold-400:#FBBF24;
  --sunset: linear-gradient(135deg,#F97316 0%,#FBBF24 100%);
  --sunset-soft: linear-gradient(135deg,#FFF3E4 0%,#FFEBD1 100%);

  --green-700:#1F7A3A;
  --green-600:#2FA84F;
  --green-500:#3AA655;
  --green-100:#E6F6EA;

  --bg:#FBF9F4;
  --bg-dim:#F4F0E7;
  --card:#FFFFFF;
  --ink:#16233D;
  --ink-soft:#5B6B84;
  --ink-faint:#94A1B5;
  --line:#EAE4D8;
  --line-soft:#F0ECE2;
  --danger:#E0483E;
  --danger-soft:#FDECEA;

  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:11px;
  --radius-pill:999px;

  --shadow-card: 0 1px 2px rgba(22,35,61,.04), 0 8px 24px -12px rgba(22,35,61,.14);
  --shadow-pop: 0 12px 32px -8px rgba(22,35,61,.28);

  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Inter', system-ui, sans-serif;
  --font-data:'Space Grotesk', 'Inter', system-ui, sans-serif;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 15% -10%, #FFF3E2 0%, transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, #EAF6ED 0%, transparent 55%),
    var(--bg-dim);
  min-height:100vh;
}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit;}
img{max-width:100%; display:block;}
::selection{background:#FFE1B8;}
a{color:inherit;}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ---------------- Demo shell / toolbar ---------------- */
.demo-shell{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:22px 16px 60px;
}
.demo-toolbar{
  width:100%;
  max-width:1200px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:10px 18px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-card);
  margin-bottom:26px;
  flex-wrap:wrap;
}
.demo-toolbar .brand{
  display:flex; align-items:center; gap:10px;
}
.demo-toolbar .brand img{height:30px; width:auto;}
.demo-toolbar .brand .meta{display:flex; flex-direction:column; line-height:1.15;}
.demo-toolbar .brand .meta b{font-family:var(--font-display); font-size:15px; color:var(--navy-700);}
.demo-toolbar .brand .meta span{font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:.02em;}
.view-toggle{
  display:flex; gap:4px; background:var(--bg-dim); padding:4px; border-radius:var(--radius-pill);
  border:1px solid var(--line);
}
.view-toggle button{
  border:none; background:transparent; padding:9px 16px; border-radius:var(--radius-pill);
  font-size:13px; font-weight:700; color:var(--ink-soft); transition:.15s;
}
.view-toggle button.active{background:var(--navy-700); color:#fff; box-shadow:0 4px 10px -3px rgba(27,58,107,.5);}
.demo-toolbar .reset-btn{
  border:1px solid var(--line); background:#fff; color:var(--ink-soft); font-size:12.5px; font-weight:700;
  padding:9px 14px; border-radius:var(--radius-pill); display:flex; align-items:center; gap:6px;
}
.demo-toolbar .reset-btn:hover{border-color:var(--navy-600); color:var(--navy-700);}

/* ================= PHONE FRAME ================= */
.phone-wrap{display:none;}
.phone-wrap.active{display:block;}
.phone{
  width:390px;
  max-width:94vw;
  height:844px;
  max-height:88vh;
  background:var(--navy-900);
  border-radius:46px;
  padding:14px;
  box-shadow: var(--shadow-pop), 0 0 0 2px #0a1730;
  position:relative;
}
.phone-screen{
  width:100%; height:100%;
  background:var(--bg);
  border-radius:32px;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}
.notch{
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  width:120px; height:26px; background:var(--navy-900); border-radius:0 0 18px 18px; z-index:50;
}
.statusbar{
  height:46px; flex:0 0 auto; display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 26px 6px; font-size:14px; font-weight:700; color:var(--ink); background:transparent; z-index:20; position:relative;
}
.statusbar .icons{display:flex; gap:5px; align-items:center;}

.screen-area{
  flex:1 1 auto;
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
  scrollbar-width:none;
}
.screen-area::-webkit-scrollbar{display:none;}

.screen{
  min-height:100%;
  display:flex;
  flex-direction:column;
  animation:screenIn .22s ease;
}
@keyframes screenIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* ---------------- Bottom Nav ---------------- */
.bottomnav{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  position:relative;
  z-index:30;
}
.navitem{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--ink-faint); font-size:10.5px; font-weight:700;
  padding:4px 8px; width:64px;
}
.navitem svg{width:22px; height:22px;}
.navitem.on{color:var(--navy-700);}
.navitem.on svg{stroke:var(--navy-700);}
.navitem .postbtn{
  width:52px; height:52px; border-radius:50%;
  background:var(--sunset);
  display:flex; align-items:center; justify-content:center;
  margin-top:-30px;
  box-shadow:0 10px 20px -6px rgba(249,115,22,.55), 0 0 0 5px var(--bg);
}
.navitem .postbtn svg{width:24px; height:24px; stroke:#fff;}

/* ---------------- Top Nav ---------------- */
.topbar{
  flex:0 0 auto;
  display:flex; align-items:center; gap:10px;
  padding:10px 16px 12px;
  background:var(--bg);
  position:relative; z-index:10;
}
.topbar .back{
  width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.topbar h1{font-family:var(--font-display); font-size:18px; margin:0; flex:1; color:var(--navy-800);}
.topbar .action{
  width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}

/* ---------------- Typography ---------------- */
h1,h2,h3{font-family:var(--font-display); color:var(--navy-800); margin:0;}
.eyebrow{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--orange-600);}
.muted{color:var(--ink-soft);}
.faint{color:var(--ink-faint);}

/* ---------------- Buttons ---------------- */
.btn{
  border:none; border-radius:var(--radius-pill); font-weight:700; font-size:14.5px;
  padding:14px 20px; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:.15s; width:100%;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--navy-700); color:#fff; box-shadow:0 8px 18px -8px rgba(27,58,107,.6);}
.btn-sunset{background:var(--sunset); color:#fff; box-shadow:0 8px 18px -8px rgba(249,115,22,.6);}
.btn-green{background:var(--green-600); color:#fff; box-shadow:0 8px 18px -8px rgba(47,168,79,.55);}
.btn-outline{background:#fff; color:var(--navy-700); border:1.5px solid var(--navy-700);}
.btn-outline-soft{background:#fff; color:var(--ink); border:1.5px solid var(--line);}
.btn-ghost{background:transparent; color:var(--ink-soft); font-weight:600;}
.btn-danger-outline{background:#fff; color:var(--danger); border:1.5px solid var(--danger-soft);}
.btn-sm{padding:9px 14px; font-size:13px; width:auto;}
.btn[disabled]{opacity:.45; pointer-events:none;}

/* ---------------- Cards ---------------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
  box-shadow:var(--shadow-card);
}
.pad{padding:16px;}
.pad-lg{padding:20px;}

/* ---------------- Badges ---------------- */
.badge{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800;
  padding:4px 9px; border-radius:var(--radius-pill); letter-spacing:.01em;
}
.badge-free{background:var(--green-100); color:var(--green-700);}
.badge-negotiable{background:#FFF3E2; color:var(--orange-600);}
.badge-harvest{background:var(--sunset); color:#fff;}
.badge-verified{background:var(--navy-100); color:var(--navy-700);}
.badge-status-active{background:var(--green-100); color:var(--green-700);}
.badge-status-reserved{background:#FFF3E2; color:var(--orange-600);}
.badge-status-sold{background:var(--navy-100); color:var(--navy-700);}
.badge-status-given{background:var(--green-100); color:var(--green-700);}

/* ---------------- Inputs ---------------- */
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px;}
.field input[type=text], .field input[type=tel], .field input[type=number], .field textarea, .field select{
  width:100%; border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:13px 14px;
  font-size:14.5px; color:var(--ink); background:#fff; outline:none; transition:.15s;
}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--navy-600); box-shadow:0 0 0 3px var(--navy-100);}
.field textarea{resize:none; min-height:88px;}
.searchbar{
  display:flex; align-items:center; gap:9px; background:#fff; border:1.5px solid var(--line);
  border-radius:var(--radius-pill); padding:12px 16px;
}
.searchbar input{border:none; outline:none; flex:1; font-size:14px; background:transparent;}
.searchbar svg{flex:0 0 auto; stroke:var(--ink-faint);}

/* ---------------- Tabs ---------------- */
.tabs{display:flex; gap:6px; overflow-x:auto; padding:2px 0; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto; padding:9px 15px; border-radius:var(--radius-pill); font-size:13px; font-weight:700;
  background:#fff; border:1.5px solid var(--line); color:var(--ink-soft); white-space:nowrap;
}
.tab.on{background:var(--navy-700); border-color:var(--navy-700); color:#fff;}
.tab.on.harvest{background:var(--sunset); border-color:transparent;}

/* ---------------- Product / Harvest cards ---------------- */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.pcard{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden;
  box-shadow:var(--shadow-card); text-align:left; border-width:1px;
}
.pcard .thumb{
  height:110px; width:100%; display:flex; align-items:center; justify-content:center; font-size:38px;
  position:relative;
}
.pcard .thumb.thumb-photo{
  background-size:cover; background-position:center; font-size:0;
}
.pcard .thumb.thumb-photo::after{
  content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.22) 100%);
}
.pcard .thumb .save{
  position:absolute; top:7px; right:7px; width:26px; height:26px; border-radius:50%;
  background:rgba(255,255,255,.9); display:flex; align-items:center; justify-content:center; border:none;
}
.pcard .body{padding:10px 11px 12px;}
.pcard .title{font-size:13px; font-weight:700; color:var(--ink); line-height:1.25; margin-bottom:4px; height:33px; overflow:hidden;}
.pcard .price{font-family:var(--font-data); font-weight:700; font-size:14.5px; color:var(--navy-800);}
.pcard .price.free{color:var(--green-700);}
.pcard .meta-row{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
.pcard .loc{font-size:10.5px; color:var(--ink-faint); display:flex; align-items:center; gap:3px;}

.rowcard{
  display:flex; gap:12px; background:#fff; border:1px solid var(--line); border-radius:var(--radius-md);
  padding:10px; box-shadow:var(--shadow-card); align-items:center; text-align:left; width:100%;
}
.rowcard .thumb-sm{width:64px; height:64px; border-radius:var(--radius-sm); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:26px; background-size:cover; background-position:center;}
.rowcard .info{flex:1; min-width:0;}
.rowcard .info .title{font-size:13.5px; font-weight:700; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rowcard .info .sub{font-size:11.5px; color:var(--ink-faint);}

/* thumb color rotation for mock imagery */
.tc1{background:linear-gradient(135deg,#EAF1FF,#DCE7FB);}
.tc2{background:linear-gradient(135deg,#FFF3E2,#FFE6C4);}
.tc3{background:linear-gradient(135deg,#E6F6EA,#D3EFD9);}
.tc4{background:linear-gradient(135deg,#FDEDEA,#FBDCD5);}
.tc5{background:linear-gradient(135deg,#F1ECFB,#E4DAF7);}
.tc6{background:linear-gradient(135deg,#FFF9E0,#FFF0BD);}

/* ---------------- Feature card (Home Harvest) ---------------- */
.harvest-feature{
  background:var(--sunset); border-radius:var(--radius-lg); padding:20px; color:#fff; position:relative; overflow:hidden;
}
.harvest-feature::after{
  content:"🍅🌿🍌"; position:absolute; right:-6px; bottom:-14px; font-size:64px; opacity:.22; letter-spacing:4px;
}
.harvest-feature h2{color:#fff; font-size:21px;}
.harvest-feature p{color:rgba(255,255,255,.92); font-size:13px; margin:6px 0 14px;}
.harvest-feature .tags{font-size:12px; color:rgba(255,255,255,.85); margin-bottom:14px;}
.harvest-feature .cta{
  display:inline-flex; align-items:center; gap:6px; background:#fff; color:var(--orange-600); font-weight:800;
  font-size:13px; padding:10px 16px; border-radius:var(--radius-pill); border:none;
}

/* ---------------- Quick actions ---------------- */
.quick3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.qbtn{
  background:#fff; border:1.5px solid var(--line); border-radius:var(--radius-md); padding:14px 6px;
  display:flex; flex-direction:column; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--ink);
}
.qbtn .ic{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px;}
.qbtn.give .ic{background:var(--green-100);}
.qbtn.sell .ic{background:#FFF3E2;}
.qbtn.harvest .ic{background:var(--sunset);}

/* ---------------- Empty / success states ---------------- */
.empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:50px 30px; gap:12px;}
.empty-state .smiley{width:64px; height:64px;}
.empty-state h3{font-size:16px;}
.empty-state p{font-size:13px; color:var(--ink-faint); max-width:240px;}

.success-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:60px 28px 30px; gap:14px; flex:1;}
.success-state .burst{width:84px; height:84px; border-radius:50%; background:var(--sunset); display:flex; align-items:center; justify-content:center; font-size:38px; box-shadow:0 14px 28px -10px rgba(249,115,22,.55);}
.success-state.give .burst{background:var(--green-600); box-shadow:0 14px 28px -10px rgba(47,168,79,.5);}
.success-state h2{font-size:20px;}
.success-state p{font-size:13.5px; color:var(--ink-soft); max-width:260px;}

/* ---------------- Step progress (post flows) ---------------- */
.steps{display:flex; gap:6px; padding:0 16px 14px;}
.steps i{flex:1; height:5px; border-radius:3px; background:var(--line);}
.steps i.done{background:var(--sunset);}

/* ---------------- Photo upload grid ---------------- */
.photogrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.photobox{
  aspect-ratio:1; border-radius:var(--radius-sm); border:1.5px dashed var(--line); background:#fff;
  display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--ink-faint); position:relative; overflow:hidden;
}
.photobox.filled{border-style:solid; border-color:transparent;}
.photobox .rm{position:absolute; top:4px; right:4px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; border:none;}

/* ---------------- Chip select ---------------- */
.chipwrap{display:flex; flex-wrap:wrap; gap:8px;}
.chip{padding:9px 15px; border-radius:var(--radius-pill); border:1.5px solid var(--line); background:#fff; font-size:13px; font-weight:700; color:var(--ink-soft);}
.chip.on{background:var(--navy-700); border-color:var(--navy-700); color:#fff;}
.chip.on.harvest{background:var(--sunset); border-color:transparent;}
.chip.on.give{background:var(--green-600); border-color:var(--green-600);}

/* ---------------- Toggle pair (Fixed/Negotiable, Sell/Give) ---------------- */
.pairsel{display:flex; gap:10px;}
.pairsel button{
  flex:1; padding:14px 8px; border-radius:var(--radius-md); border:1.5px solid var(--line); background:#fff;
  font-weight:700; font-size:13.5px; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:4px;
}
.pairsel button.on{border-color:var(--navy-700); background:var(--navy-100); color:var(--navy-800);}

/* ---------------- Bottom sheet / Modal ---------------- */
.overlay{
  position:absolute; inset:0; background:rgba(15,34,66,.45); z-index:80; display:none; align-items:flex-end;
}
.overlay.show{display:flex;}
.sheet{
  width:100%; background:#fff; border-radius:22px 22px 0 0; padding:8px 18px 22px; max-height:80%; overflow-y:auto;
  animation:sheetUp .22s ease;
}
@keyframes sheetUp{from{transform:translateY(30px); opacity:0;} to{transform:none; opacity:1;}}
.sheet .grabber{width:38px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 14px;}
.sheet h3{font-size:16.5px; margin-bottom:14px;}

.overlay.center{align-items:center; justify-content:center;}
.modal{
  width:88%; background:#fff; border-radius:20px; padding:22px; animation:sheetUp .18s ease;
}

/* ---------------- Toast ---------------- */
.toast{
  position:absolute; left:50%; bottom:90px; transform:translateX(-50%); background:var(--navy-900); color:#fff;
  font-size:12.5px; font-weight:600; padding:10px 16px; border-radius:var(--radius-pill); z-index:120; opacity:0;
  transition:.25s; pointer-events:none; white-space:nowrap; box-shadow:0 8px 20px -6px rgba(0,0,0,.4);
}
.toast.show{opacity:1; transform:translate(-50%,-6px);}

/* ---------------- Profile ---------------- */
.profile-hero{background:var(--navy-700); border-radius:0 0 26px 26px; padding:20px 20px 26px; color:#fff; position:relative;}
.avatar{width:64px; height:64px; border-radius:50%; background:var(--sunset); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; color:#fff; border:3px solid rgba(255,255,255,.4);}
.stars{color:var(--gold-400); font-size:13px; letter-spacing:1px;}
.menu-row{display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line-soft); background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; font-size:14px; font-weight:600; color:var(--ink);}
.menu-row .ic{width:34px; height:34px; border-radius:10px; background:var(--bg-dim); display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto;}
.menu-row .chev{margin-left:auto; color:var(--ink-faint);}

/* ---------------- Messaging ---------------- */
.msg{max-width:76%; padding:10px 13px; border-radius:16px; font-size:13.5px; line-height:1.4; margin-bottom:8px;}
.msg.in{background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; align-self:flex-start;}
.msg.out{background:var(--navy-700); color:#fff; border-bottom-right-radius:4px; align-self:flex-end;}
.msg.offer{background:var(--sunset-soft); border:1px solid #FBD6A8; border-radius:14px; align-self:flex-start; max-width:82%;}
.msg.offer.out{background:#EAF1FF; border-color:#CBDCFB; align-self:flex-end;}

/* ---------------- Notification card ---------------- */
.notif{display:flex; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line-soft); align-items:flex-start;}
.notif .ic{width:38px; height:38px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:16px;}
.notif.unread{background:linear-gradient(90deg, #FFF6EA, transparent 30%);}

/* ================= ADMIN DASHBOARD ================= */

  render();

}

  Object.assign(state, opts);

  const prev = state.stack.pop();
  if(prev){ state.screen = prev; render(); }
  else { state.screen='home'; state.activeTab='home'; render(); }
}

state.exploreMap = false;
function distKm(item){ return parseFloat(item.distance) || 0; }
const NEARBY_RADIUS_KM = 4;
state.filters = {distance:'Any', price:'Any', condition:'Any', negotiable:'Any'};
function passesFilters(item, isHarvest){
  const f = state.filters || {};
  if(f.distance && f.distance!=='Any'){
    const maxKm = f.distance==='<2km'?2 : f.distance==='<5km'?5 : f.distance==='<10km'?10 : Infinity;
    if(distKm(item) > maxKm) return false;
  }
  if(f.price && f.price!=='Any'){
    const isFree = isHarvest ? item.listingType==='give' : item.priceType==='free';
    const price = item.price||0;
    if(f.price==='Free only' && !isFree) return false;
    if(f.price==='Under GH₵100' && (isFree || price>=100)) return false;
    if(f.price==='Under GH₵500' && (isFree || price>=500)) return false;
  }
  if(!isHarvest && f.condition && f.condition!=='Any' && item.condition!==f.condition) return false;
  if(!isHarvest && f.negotiable && f.negotiable!=='Any'){
    if(f.negotiable==='Negotiable only' && item.priceType!=='negotiable') return false;
    if(f.negotiable==='Fixed price only' && item.priceType!=='fixed') return false;
  }
  return true;
}
function applySortMode(arr, mode){
  const copy = arr.slice();
  if(mode==='Nearest') copy.sort((a,b)=>distKm(a)-distKm(b));
  else if(mode==='Lowest Price') copy.sort((a,b)=>(a.price||0)-(b.price||0));
  // 'Newest' and 'Recommended' keep existing order (newly-published items are already unshifted to the front)
  return copy;
}
function getExploreResults(tab){
  const cat = state.exploreCategory || null;
  let results = [], harvestResults = [];
  if(tab==='harvest'){
    harvestResults = HARVEST.filter(h=>{
      if(state.exploreQuery && !h.produce.toLowerCase().includes(state.exploreQuery.toLowerCase())) return false;
      if(tab==='nearby' && distKm(h) > NEARBY_RADIUS_KM) return false;
      return passesFilters(h, true);
    });
    let mode = state.sortBy || 'Recommended';
    harvestResults = applySortMode(harvestResults, mode);
  } else {
    results = LISTINGS.filter(l=>{
      if(tab==='sale' && l.priceType==='free') return false;
      if(tab==='free' && l.priceType!=='free') return false;
      if(tab==='nearby' && distKm(l) > NEARBY_RADIUS_KM) return false;
      if(cat && l.category!==cat) return false;
      if(state.exploreQuery){
        const q = state.exploreQuery.toLowerCase();
        if(!l.title.toLowerCase().includes(q) && !l.category.includes(q)) return false;
      }
      return passesFilters(l, false);
    });
    let mode = state.sortBy || 'Recommended';
    if(tab==='nearby' && mode==='Recommended') mode = 'Nearest';
    results = applySortMode(results, mode);
  }
  return {results, harvestResults};
}
SCREENS.explore = () => {
  const tab = state.exploreTab || 'all';
  const {results, harvestResults} = getExploreResults(tab);
  const tabs = [
    {id:'all', label:'All'}, {id:'sale', label:'For Sale'}, {id:'free', label:'Free'},
    {id:'harvest', label:'🌱 Home Harvest'}, {id:'nearby', label:'Nearby'},
  ];

/* Shared state machine: ACTIVE -> RESERVED -> SOLD / GIVEN AWAY.
   Returns the [label, nextStatus, buttonClass] actions available from an item's current status. */
function listingStatusActions(l, isHarvest){
  const finalLabel = isHarvest ? (l.listingType==='give' ? 'Mark as Given Away' : 'Mark as Sold')
                                : (l.priceType==='free' ? 'Mark as Given Away' : 'Mark as Sold');
  const finalStatus = isHarvest ? (l.listingType==='give' ? 'given' : 'sold')
                                 : (l.priceType==='free' ? 'given' : 'sold');
  if(l.status==='active'){
    return [['Mark as Reserved','reserved','btn-outline'], [finalLabel, finalStatus, 'btn-primary']];
  }
  if(l.status==='reserved'){
    return [['Unreserve & Relist','active','btn-outline-soft'], [finalLabel, finalStatus, 'btn-primary']];
  }
  return [];
}
function ownerDetailFooter(l, isHarvest){
  const actions = listingStatusActions(l, isHarvest);
  if(!actions.length){
    return `<div class="btn btn-outline-soft" style="flex:1; pointer-events:none;">This listing is ${l.status.toUpperCase()}</div>`;
  }
  return actions.map(([label,status,cls])=>`<button class="btn ${cls}" style="flex:1;" onclick="closeListingDeal('${l.id}','${status}',${isHarvest})">${label}</button>`).join('');
}

function openMessageSheet(sellerId, listingId, kind){
  const defaultMsg = kind==='interest' ? "Hi! I'm interested in this — is it still available?" : "Hi, is this still available?";
  openSheet(`<h3>Message ${USERS[sellerId]?USERS[sellerId].name:'seller'}</h3>

function sendNewMessage(sellerId, listingId){
  const txt = document.getElementById('msgText').value.trim();
  if(!txt){ toast('Write a message first'); return; }
  let convo = CONVERSATIONS.find(c=>c.withId===sellerId && c.listingId===listingId);
  if(!convo){
    convo = {id:'c'+(CONVERSATIONS.length+1), withId:sellerId, listingId, lastMsg:txt, time:'Just now', unread:false, thread:[]};
    CONVERSATIONS.unshift(convo);
  }
  convo.thread.push({from:'me', text:txt});
  convo.lastMsg = txt; convo.time='Just now';
  closeSheet();
  toast('Message sent');
  go('chat', {chatId:convo.id});
}

  const l = LISTINGS.find(x=>x.id===listingId);
  openSheet(`<h3>Make an Offer</h3>

    <div class="field"><label>Message (optional)</label><textarea id="offerMsg" placeholder="Would you accept this offer?"></textarea></div>
    <button class="btn btn-sunset" onclick="submitOffer('${listingId}')">Submit Offer</button>`);
}
function submitOffer(listingId){
  const amt = Number(document.getElementById('offerAmt').value);
  if(!amt || amt<=0){ toast('Enter a valid offer amount'); return; }
  const msg = document.getElementById('offerMsg').value.trim();
  const l = LISTINGS.find(x=>x.id===listingId);
  const offer = {id:'o'+(OFFERS.length+1), listingId, buyerId:'u_michael', sellerId:l.sellerId, amount:amt, message:msg, status:'pending', createdAt:'Just now'};
  OFFERS.push(offer);
  let convo = CONVERSATIONS.find(c=>c.withId===l.sellerId && c.listingId===listingId);
  if(!convo){ convo={id:'c'+(CONVERSATIONS.length+1), withId:l.sellerId, listingId, lastMsg:'', time:'Just now', unread:false, thread:[]}; CONVERSATIONS.unshift(convo); }
  convo.thread.push({from:'me', type:'offer', amount:amt, text:msg||'Would you accept this offer?'});
  convo.lastMsg = `You offered ${fmtMoney(amt)}`; convo.time='Just now';
  closeSheet();
  toast('Offer sent!');
  go('chat', {chatId:convo.id});
}

function sellerRespondOffer(offerId, action){
  const offer = OFFERS.find(o=>o.id===offerId);
  if(!offer) return;
  const l = LISTINGS.find(x=>x.id===offer.listingId);
  if(action==='accept'){
    offer.status='accepted';
    if(l){ l.status='reserved'; }
    toast('Offer accepted — listing marked RESERVED');
    pushNotification('accepted', `Your offer of ${fmtMoney(offer.amount)} for "${l?.title||'the listing'}" was accepted — it's now RESERVED. The seller will mark it SOLD once the handover is complete.`);
  } else if(action==='decline'){
    offer.status='declined';
    toast('Offer declined');
    pushNotification('declined', `Your offer of ${fmtMoney(offer.amount)} for "${l?.title||'the listing'}" was declined.`);
  }
  render();
}
function openCounterSheet(offerId){
  const offer = OFFERS.find(o=>o.id===offerId);
  openSheet(`<h3>Send a Counter-Offer</h3>
    <p class="muted" style="font-size:13px; margin-bottom:14px;">Buyer offered <b style="color:var(--ink);">${fmtMoney(offer.amount)}</b></p>
    <div class="field"><label>Your counter (GH₵)</label><input type="number" id="counterAmt" placeholder="e.g. ${offer.amount+30}"></div>
    <button class="btn btn-sunset" onclick="submitCounter('${offerId}')">Send Counter-Offer</button>`);
}
function submitCounter(offerId){
  const amt = Number(document.getElementById('counterAmt').value);
  if(!amt||amt<=0){ toast('Enter a valid amount'); return; }
  const offer = OFFERS.find(o=>o.id===offerId);
  const l = LISTINGS.find(x=>x.id===offer.listingId);
  offer.status='countered'; offer.counterAmount=amt;
  closeSheet(); toast('Counter-offer sent');
  pushNotification('offer', `You sent a counter-offer of ${fmtMoney(amt)} for "${l?.title||'the listing'}".`);
  render();
}
function resolveCounterOffer(offerId, action){
  const offer = OFFERS.find(o=>o.id===offerId);
  if(!offer) return;
  const l = LISTINGS.find(x=>x.id===offer.listingId);
  if(action==='accept'){
    offer.status='accepted';
    if(l){ l.status='reserved'; }
    toast('Counter accepted — listing marked RESERVED');
    pushNotification('accepted', `Counter-offer of ${fmtMoney(offer.counterAmount)} accepted — "${l?.title||'listing'}" is now RESERVED.`);
  } else {
    offer.status='declined';
    toast('Counter declined');
    pushNotification('declined', `You declined the counter-offer of ${fmtMoney(offer.counterAmount)} for "${l?.title||'listing'}".`);
  }
  render();
}
function openBuyerCounterSheet(offerId){
  const offer = OFFERS.find(o=>o.id===offerId);
  openSheet(`<h3>Send a New Offer</h3>
    <p class="muted" style="font-size:13px; margin-bottom:14px;">Seller countered with <b style="color:var(--ink);">${fmtMoney(offer.counterAmount)}</b></p>
    <div class="field"><label>Your new offer (GH₵)</label><input type="number" id="buyerCounterAmt" placeholder="e.g. ${Math.round((offer.amount+offer.counterAmount)/2)}"></div>

}
function submitBuyerCounter(offerId){

/* Lets the owner of a listing close the deal directly from the conversation —
   covers "I'm interested" free/harvest chats and give-away items with no formal offer. */
function ownerCloseDealBlock(l, isHarvest){
  if(!l) return '';
  const isMine = isHarvest ? l.gardenerId==='u_michael' : l.sellerId==='u_michael';
  if(!isMine) return '';
  const actions = listingStatusActions(l, isHarvest);
  if(!actions.length) return '';
  return `<div class="card pad" style="margin:8px 0; background:var(--bg-dim); border:none;">
    <div style="font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:8px;">This is your listing — ready to move it forward?</div>
    <div style="display:flex; gap:8px;">
      ${actions.map(([label,status,cls])=>`<button class="btn ${cls} btn-sm" style="flex:1;" onclick="closeListingDeal('${l.id}','${status}',${isHarvest})">${label}</button>`).join('')}
    </div>
  </div>`;
}
function closeListingDeal(id, status, isHarvest){
  const arr = isHarvest ? HARVEST : LISTINGS;
  const item = arr.find(x=>x.id===id);
  if(!item) return;
  const wasReserved = item.status==='reserved';
  item.status = status;

  if(status==='active' && wasReserved){
    // Unreserving: the previous buyer's accepted offer no longer holds — release it so the
    // listing shows no stale "accepted" offer and the buyer sees why the deal fell through.
    if(!isHarvest){
      const heldOffer = OFFERS.find(o=>o.listingId===id && o.status==='accepted');
      if(heldOffer){
        heldOffer.status='declined';
        pushNotification('declined', `The reservation on "${item.title}" was cancelled — the item is active again.`);
      }
    }
    toast('Unreserved — listing is active and visible to buyers again');
    pushNotification('status', `Your listing "${item.title||item.produce}" is active again and visible to buyers.`);
  } else {
    toast(`Marked as ${status.toUpperCase()}`);
    pushNotification('status', `Your listing "${item.title||item.produce}" is now ${status.toUpperCase()}.`);
  }
  render();
}
function sendChatInput(cid){
  const input = document.getElementById('chatInput');
  const txt = input.value.trim();
  if(!txt) return;
  const c = CONVERSATIONS.find(x=>x.id===cid);
  c.thread.push({from:'me', text:txt});
  c.lastMsg=txt; c.time='Just now';
  render();
}

function simulateIncomingOffer(listing, immediate){
  if(!listing || listing.priceType==='free') return;
  const buyerPool = ['u_kofi','u_efua','u_yaw','u_akosua'];
  const buyerId = buyerPool[Math.floor(Math.random()*buyerPool.length)];
  const buyer = USERS[buyerId];
  const base = listing.price || 100;
  const amount = Math.max(10, Math.round((base * (0.72 + Math.random()*0.18)) / 5) * 5);
  const run = () => {
    const offer = {id:'o'+(OFFERS.length+1+Math.floor(Math.random()*1000)), listingId:listing.id, buyerId, sellerId:'u_michael', amount, message:'Would you accept this offer?', status:'pending', createdAt:'Just now'};
    OFFERS.push(offer);
    const convo = {id:'c'+(CONVERSATIONS.length+1+Math.floor(Math.random()*1000)), withId:buyerId, listingId:listing.id, lastMsg:`Offered ${fmtMoney(amount)}`, time:'Just now', unread:true,
      thread:[{from:'them', text:`Hi, is the "${listing.title}" still available?`},{from:'them', type:'offer', amount, text:'Would you accept this offer?'}]};
    CONVERSATIONS.unshift(convo);
    pushNotification('offer', `${buyer.name} made an offer of ${fmtMoney(amount)} on your listing "${listing.title}".`);
    if(state.screen!=='postSuccess') render(); else renderBottomNav();
    toast(`💬 ${buyer.name} just made an offer on "${listing.title}"!`);
  };
  if(immediate) run(); else setTimeout(run, 2200);
}
function validatePostStep(flow, step, d){
  if(flow==='sell'){
    if(step===2 && !((d.title||'').trim())) return 'Please enter a title for your item.';
    if(step===3 && (!d.price || d.price<=0)) return 'Please enter a price.';
    if(step===4 && !d.location) return 'Please choose an approximate location.';
  }
  if(flow==='give'){
    if(step===2 && !((d.title||'').trim())) return 'Please enter a title for your item.';
    if(step===3 && !d.location) return 'Please choose an approximate location.';
  }
  if(flow==='harvest'){
    if(step===1 && !d.category) return "Please select what you're harvesting.";
    if(step===2 && !((d.title||'').trim())) return 'Please enter a title for your harvest.';
    if(step===3 && (!d.quantity || d.quantity<=0 || !d.unit)) return 'Please enter a quantity and choose a unit.';
    if(step===4 && d.harvestAction==='sell' && (!d.price || d.price<=0)) return 'Please enter a price per unit.';
    if(step===5 && !d.availability) return 'Please choose availability.';
    if(step===6 && !d.location) return 'Please choose an approximate location.';
  }
  return null;
}
function postStepNext(screen, max){
  // pull field values into postData before advancing
  const d = state.postData;
  const t = document.getElementById('f_title'); if(t) d.title = t.value;
  const de = document.getElementById('f_desc'); if(de) d.desc = de.value;
  const pr = document.getElementById('f_price'); if(pr) d.price = Number(pr.value)||0;
  const hpr = document.getElementById('f_hprice'); if(hpr) d.price = Number(hpr.value)||0;
  const qty = document.getElementById('f_qty'); if(qty) d.quantity = Number(qty.value)||0;
  const flow = screen==='postSell'?'sell':screen==='postGive'?'give':'harvest';
  const error = validatePostStep(flow, state.postStep, d);
  if(error){ toast(error); return; }
  if(state.postStep < max){ state.postStep++; render(); }
}
function postStepBack(){
  if(state.postStep>1){ state.postStep--; render(); }
}

  const completedHarvest = HARVEST.filter(h=>(h.status==='sold'||h.status==='given') && h.gardenerId==='u_michael');

  function roleLine(item, isHarvest){
    const isMine = isHarvest ? item.gardenerId==='u_michael' : item.sellerId==='u_michael';
    const priceText = (isHarvest ? item.listingType==='give' : item.priceType==='free') ? 'FREE' : fmtMoney(item.price)+(isHarvest?'/'+item.unit:'');
    if(item.status==='reserved'){
      return isMine ? `You're holding this for a buyer · ${priceText}` : `Reserved for you, awaiting handover · ${priceText}`;
    }
    if(item.status==='given'){
      return isMine ? `You gave this away` : `Given to you`;
    }
    // sold
    return isMine ? `You sold · ${priceText}` : `You bought · ${priceText}`;
  }
  function activityRow(item, isHarvest){
    const title = isHarvest ? item.produce : item.title;
    const img = photoUrl(item.img || (isHarvest?'tomatoes':categoryPhotoKey(item.category)), 200);
    const target = isHarvest ? `go('harvest',{harvestId:'${item.id}'})` : `go('product',{productId:'${item.id}'})`;
    return `<button class="rowcard" style="margin-bottom:10px; width:100%; text-align:left;" onclick="${target}">
      <div class="thumb-sm" style="background-image:url('${img}');"></div>
      <div class="info"><div class="title">${title}</div><div class="sub">${roleLine(item,isHarvest)}</div></div>
      <span class="badge badge-status-${item.status}">${item.status.toUpperCase()}</span>
    </button>`;
  }

  let body;
  if(tab==='offers'){
    body = !myOffers.length ? emptyState('💬','No offers yet','Offers you make or receive will appear here.') :
      myOffers.map(o=>{
        const l = LISTINGS.find(x=>x.id===o.listingId);
        const role = o.buyerId==='u_michael' ? 'You offered' : 'Offer received';
        const statusColor = o.status==='accepted'?'badge-status-active': o.status==='declined'?'badge-status-sold':'badge-negotiable';
        return `<div class="rowcard" style="margin-bottom:10px;">
          <div class="thumb-sm" style="background-image:url('${l?photoUrl(l.img||categoryPhotoKey(l.category),200):photoUrl('boxFallback',200)}');"></div>
          <div class="info">
            <div class="title">${l?.title||'Listing'}</div>
            <div class="sub">${role}: <b style="color:var(--ink);">${fmtMoney(o.amount)}</b></div>
          </div>
          <span class="badge ${statusColor}">${o.status.toUpperCase()}</span>
        </div>`;
      }).join('');
  } else if(tab==='reserved'){
    const items = [...reservedListings.map(l=>({item:l,isHarvest:false})), ...reservedHarvest.map(h=>({item:h,isHarvest:true}))];
    body = !items.length ? emptyState('🤝','Nothing reserved right now','Accepted deals awaiting handover will show up here.') :
      items.map(({item,isHarvest})=>activityRow(item,isHarvest)).join('');
  } else {
    const items = [...completedListings.map(l=>({item:l,isHarvest:false})), ...completedHarvest.map(h=>({item:h,isHarvest:true}))];
    body = !items.length ? emptyState('🧾','No completed activity yet','Completed sales, purchases, and gifts will show up here.') :
      items.map(({item,isHarvest})=>activityRow(item,isHarvest)).join('');
  }

  return `
  ${topbar('My Activity')}
  <div style="padding:0 18px 90px;">
    <div class="tabs" style="margin-bottom:14px;">
      <button class="tab ${tab==='offers'?'on':''}" onclick="state.activityTab='offers'; render();">Offers</button>
      <button class="tab ${tab==='reserved'?'on':''}" onclick="state.activityTab='reserved'; render();">Reserved</button>
      <button class="tab ${tab==='completed'?'on':''}" onclick="state.activityTab='completed'; render();">Completed</button>
    </div>
    ${body}
  </div>`;
};
